plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'io.streamingfast.besu.plugins.firehose'
version '1.0-SNAPSHOT'

sourceCompatibility = 21

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.60.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
            include 'sf/ethereum/type/v2/type.proto'
        }
    }
}

repositories {
    jcenter()
    maven { url 'https://hyperledger.jfrog.io/hyperledger/besu-maven' }
    mavenCentral()
}

dependencies {
    annotationProcessor 'com.google.auto.service:auto-service:1.0-rc4'

    compileOnly 'com.google.auto.service:auto-service:1.0-rc4'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.12.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.12.0'
    compileOnly 'org.hyperledger.besu:plugin-api:25.6.0'

    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.1'

    testImplementation 'junit:junit:4.12'
}

processResources {
    duplicatesStrategy = 'EXCLUDE'
}

shadowJar {
    archiveClassifier.set('')
}

jar {
    enabled = false
}

artifacts {
    archives shadowJar
}
